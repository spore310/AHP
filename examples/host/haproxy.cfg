# Load balancers for the multi-host examples.
# Readiness, not liveness, decides where new connections go: a standby or a
# draining host answers /readyz with 503 and receives no new connection.
global
  maxconn 1024
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h
  default-server check inter 300ms fall 1 rise 1 resolvers docker init-addr last,libc,none

# Container addresses can change when a host restarts.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

# Scenario D: three active hosts share one namespace.
frontend tools
  bind :8080
  default_backend tools_hosts
backend tools_hosts
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  server tools-a tools-a:8080
  server tools-b tools-b:8080
  server tools-c tools-c:8080

# Scenario B: two replicas of one logical host, one active.
frontend app
  bind :8090
  default_backend app_replicas
backend app_replicas
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  server app-1 app-1:8080
  server app-2 app-2:8080
